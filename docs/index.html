<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickNik Marketing Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --green: #4caf7d; --amber: #e8b931; --blue: #5b9bd5; --pink: #e58aa0;
    --border: #e3e6ea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 24px 32px 8px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 22px; margin: 0; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  #updated { color: var(--muted); font-size: 13px; }
  #refresh {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 14px; cursor: pointer;
  }
  #refresh:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  #refresh:disabled { opacity: .6; cursor: default; }
  #refresh .icon { display: inline-block; }
  #refresh.loading .icon { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { padding: 16px 32px 48px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 28px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .card .label { font-size: 14px; color: var(--muted); }
  .card .value { font-size: 34px; font-weight: 700; margin: 4px 0; }
  .card .goal { font-size: 13px; color: var(--muted); }
  .bar { height: 8px; background: #edf0f3; border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  .grid-2.rev { grid-template-columns: 1fr 2fr; }
  @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  td.num { text-align: right; }
  #error { display: none; margin: 16px 0; padding: 12px 16px; background: #fdecea; border: 1px solid #f5c6c2; border-radius: 8px; color: #92400e; }
</style>
</head>
<body>
<header>
  <h1>PickNik Marketing Dashboard</h1>
  <div class="header-right">
    <span id="updated"></span>
    <button id="refresh" type="button" title="Re-fetch the latest data">
      <span class="icon">&#x21bb;</span><span>Refresh</span>
    </button>
  </div>
</header>
<main>
  <div id="error"></div>

  <h2>New deals this month by origin <span id="period"></span></h2>
  <div class="cards" id="lead-cards"></div>

  <h2>Sales pipeline (Product &amp; Services)</h2>
  <div class="chart-card"><canvas id="funnel" height="110"></canvas></div>

  <h2 id="origin-title">Deal origin</h2>
  <div class="chart-card"><canvas id="origins" height="90"></canvas></div>

  <h2>Website traffic — last 30 days (Leadfeeder)</h2>
  <div class="grid-2">
    <div class="chart-card"><canvas id="visits" height="140"></canvas></div>
    <div class="chart-card">
      <table>
        <thead><tr><th>Top companies</th><th class="num">Visits</th></tr></thead>
        <tbody id="companies"></tbody>
      </table>
    </div>
  </div>

  <h2>Traffic sources &amp; top pages</h2>
  <div class="grid-2 rev">
    <div class="chart-card"><canvas id="sources" height="220"></canvas></div>
    <div class="chart-card">
      <table>
        <thead><tr><th>Top pages</th><th class="num">Views</th></tr></thead>
        <tbody id="pages"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const COLORS = ["#4caf7d", "#e8b931", "#5b9bd5", "#e58aa0"];

// Chart instances are kept so they can be destroyed and rebuilt on refresh.
let funnelChartInst = null;
let originsChartInst = null;
let visitsChart = null;
let sourcesChartInst = null;

function showError(msg) {
  const el = document.getElementById("error");
  el.style.display = "block";
  el.textContent = msg;
}

function clearError() {
  const el = document.getElementById("error");
  el.style.display = "none";
  el.textContent = "";
}

function leadCards(data) {
  document.getElementById("period").textContent = data.period ? "— " + data.period : "";
  const wrap = document.getElementById("lead-cards");
  wrap.innerHTML = "";
  data.leadTypes.forEach((lt, i) => {
    const pct = lt.goal ? Math.min(100, Math.round(100 * lt.count / lt.goal)) : null;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="label">${lt.label}</div>
      <div class="value">${lt.count}</div>
      <div class="goal">${lt.goal ? `Goal: ${lt.goal}/mo · ${pct}%` : "deals this month"}</div>
      ${lt.goal ? `<div class="bar"><div style="width:${pct}%;background:${COLORS[i % COLORS.length]}"></div></div>` : ""}`;
    wrap.appendChild(card);
  });
}

function funnelChart(data) {
  if (funnelChartInst) funnelChartInst.destroy();
  funnelChartInst = new Chart(document.getElementById("funnel"), {
    type: "bar",
    data: {
      labels: data.dealStages.map(s => s.label),
      datasets: [
        { label: "Open deals", data: data.dealStages.map(s => s.count), backgroundColor: "#5b9bd5", borderRadius: 6 },
        { label: "Goal", data: data.dealStages.map(s => s.goal), backgroundColor: "#dfe5ec", borderRadius: 6 }
      ]
    },
    options: {
      indexAxis: "y", responsive: true,
      plugins: { legend: { position: "bottom" } },
      scales: { x: { beginAtZero: true, grid: { display: false } }, y: { grid: { display: false } } }
    }
  });
}

function originsChart(data) {
  const o = data.dealOrigins;
  const title = document.getElementById("origin-title");
  const card = document.getElementById("origins").parentElement;
  if (!o || !o.counts || !o.counts.length) {
    title.style.display = "none";
    card.style.display = "none";
    return;
  }
  title.style.display = "";
  card.style.display = "";
  const d = new Date(o.since + "T00:00:00");
  title.textContent =
    `Deal origin — ${o.totalDeals} deals created since ` +
    d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  if (originsChartInst) originsChartInst.destroy();
  originsChartInst = new Chart(document.getElementById("origins"), {
    type: "bar",
    data: {
      labels: o.counts.map(c => c.name),
      datasets: [{
        label: "Deals",
        data: o.counts.map(c => c.count),
        backgroundColor: ["#4caf7d", "#5b9bd5", "#e8b931", "#e58aa0", "#8e7cc3", "#b6c2cf"],
        borderRadius: 6
      }]
    },
    options: {
      indexAxis: "y", responsive: true,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, grid: { display: false } }, y: { grid: { display: false } } }
    }
  });
}

function trafficChart(data) {
  if (visitsChart) visitsChart.destroy();
  visitsChart = new Chart(document.getElementById("visits"), {
    type: "line",
    data: {
      labels: data.dailyVisits.map(d => d.date.slice(5)),
      datasets: [{
        label: "Visits (identified companies)",
        data: data.dailyVisits.map(d => d.visits),
        borderColor: "#4caf7d", backgroundColor: "rgba(76,175,125,.12)",
        fill: true, tension: .3, pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: "bottom" } },
      scales: { y: { beginAtZero: true }, x: { ticks: { maxTicksLimit: 10 }, grid: { display: false } } }
    }
  });
  const tbody = document.getElementById("companies");
  tbody.innerHTML = "";
  data.topCompanies.forEach(c => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${c.name}</td><td class="num">${c.visits}</td>`;
    tbody.appendChild(tr);
  });
}

function sourcesChart(data) {
  if (!data.sources || !data.sources.length) return;
  if (sourcesChartInst) sourcesChartInst.destroy();
  sourcesChartInst = new Chart(document.getElementById("sources"), {
    type: "doughnut",
    data: {
      labels: data.sources.map(s => s.name),
      datasets: [{
        data: data.sources.map(s => s.visits),
        backgroundColor: ["#4caf7d", "#5b9bd5", "#e8b931", "#e58aa0",
                          "#8e7cc3", "#76a5af", "#f6a05c", "#b6c2cf"],
        borderWidth: 0
      }]
    },
    options: { responsive: true, plugins: { legend: { position: "right" } } }
  });
}

function pagesTable(data) {
  if (!data.topPages) return;
  const tbody = document.getElementById("pages");
  tbody.innerHTML = "";
  data.topPages.forEach(p => {
    const tr = document.createElement("tr");
    const label = p.title ? `${p.path} — ${p.title}` : p.path;
    tr.innerHTML = `<td>${label}</td><td class="num">${p.views}</td>`;
    tbody.appendChild(tr);
  });
}

async function load(path) {
  const r = await fetch(path + "?t=" + Date.now());
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

async function render() {
  const [hs, lf] = await Promise.all([load("data/hubspot.json"), load("data/leadfeeder.json")]);
  document.getElementById("updated").textContent =
    "Updated " + new Date(hs.updatedAt).toLocaleString();
  leadCards(hs);
  funnelChart(hs);
  originsChart(hs);
  trafficChart(lf);
  sourcesChart(lf);
  pagesTable(lf);
}

const refreshBtn = document.getElementById("refresh");

async function refresh() {
  refreshBtn.disabled = true;
  refreshBtn.classList.add("loading");
  clearError();
  try {
    await render();
  } catch (e) {
    showError("Could not load dashboard data: " + e.message +
      ". Run the 'Refresh dashboard data' workflow from the Actions tab to regenerate it.");
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.classList.remove("loading");
  }
}

refreshBtn.addEventListener("click", refresh);
refresh();
</script>
</body>
</html>

name: Refresh dashboard data

on:
  schedule:
    - cron: "0 12 * * *"   # daily, 12:00 UTC (~6am MT)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch HubSpot data
        continue-on-error: true
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          if [ -n "$HUBSPOT_TOKEN" ]; then
            python scripts/fetch_hubspot.py
          else
            echo "HUBSPOT_TOKEN not set - skipping, keeping existing hubspot.json"
          fi

      - name: Fetch Leadfeeder data
        continue-on-error: true
        env:
          LEADFEEDER_TOKEN: ${{ secrets.LEADFEEDER_TOKEN }}
        run: |
          if [ -n "$LEADFEEDER_TOKEN" ]; then
            python scripts/fetch_leadfeeder.py
          else
            echo "LEADFEEDER_TOKEN not set - skipping, keeping existing leadfeeder.json"
          fi

      - name: Commit updated data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "Refresh dashboard data $(date -u +%F)"
          git push
